services:
  # PHP-FPM service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salespage_app
    working_dir: /var/www
    volumes:
      - .:/var/www

  # Nginx (serving Laravel)
  nginx:
    image: nginx:alpine
    container_name: salespage_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./default_nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # MySQL for local dev
  mysql:
    image: mysql:5.7
    container_name: salespage_mysql
    environment:
      MYSQL_DATABASE: salespage
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: salespage
      MYSQL_PASSWORD: salespage
    ports:
      - "3307:3306"